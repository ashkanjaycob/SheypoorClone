<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sheypoorBlack.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شیپور | خرید و فروش آنلاین، املاک، خودرو و استخدام</title>

    <!-- Web App & Apple Touch Icon Meta Tags for Standalone SPA / PWA -->
    <meta name="apple-mobile-web-app-title" content="Sheypoor" />
    <meta name="application-name" content="Sheypoor" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#3E7BFA" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/Sheypoor-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/Sheypoor-512.png" />

    <!-- Google Fonts for Latin LTR Mode -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Immediate Theme & Direction Initializer (Avoids FOUC) -->
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('sheypoor_lang') || 'fa';
          document.documentElement.lang = lang;
          document.documentElement.dir = (lang === 'fa') ? 'rtl' : 'ltr';

          var theme = localStorage.getItem('sheypoor_theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-light-3 dark:bg-night-bg text-dark-0 dark:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
